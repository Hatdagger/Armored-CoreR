name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: windows-2022
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev \
            wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev \
            libudev-dev libpulse-dev libasound2-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          for f in armored-corer acr-import; do
            for p in "build/$f" "build/$f.exe" "build/Release/$f.exe"; do
              [ -f "$p" ] && cp "$p" out/
            done
          done
          cp README.md out/
          if [ "$RUNNER_OS" = "Windows" ]; then cp tools/netplay/*.bat tools/maps/*.bat out/; fi
          cp tools/maps/tinkercad_stage.py docs/MAPS.md out/

      - uses: actions/upload-artifact@v4
        with:
          name: armored-corer-${{ matrix.name }}
          path: out/

  # Original Xbox: the engine core built with nxdk into a small test program
  # (default.xbe and an .iso for xemu or a softmodded console).
  xbox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install nxdk prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld bison flex cmake git

      - name: Get nxdk
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/XboxDev/nxdk.git "$HOME/nxdk"

      - name: Build
        run: |
          export NXDK_DIR="$HOME/nxdk"
          export PATH="$NXDK_DIR/bin:$PATH"
          make -C src/platform/xbox NXDK_DIR="$NXDK_DIR" -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: armored-corer-xbox-core-test
          path: |
            src/platform/xbox/bin/default.xbe
            src/platform/xbox/*.iso

  # Android: an APK for tablets and phones (arm64), installed directly
  # (docs/ANDROID.md). Signed with the repo's fixed test key so each new
  # build installs over the last one.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get SDL (the release CMakeLists.txt uses) and its Gradle wrapper
        run: |
          git clone --depth 1 --branch release-3.2.10 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          cp -r "$RUNNER_TEMP/SDL/android-project/gradle" "$RUNNER_TEMP/SDL/android-project/gradlew" android/
          chmod +x android/gradlew

      - name: Build the APK
        working-directory: android
        run: |
          export ACR_NDK_VERSION="$(basename "$ANDROID_NDK_LATEST_HOME")"
          echo "NDK $ACR_NDK_VERSION"
          ./gradlew --no-daemon assembleRelease -PsdlDir="$RUNNER_TEMP/SDL"

      - name: Collect
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/armored-corer-android.apk
          cp docs/ANDROID.md out/

      - name: Check the APK
        run: |
          apk=out/armored-corer-android.apk
          unzip -l "$apk" | tee apk.txt
          grep -q 'lib/arm64-v8a/libmain.so' apk.txt
          grep -q 'lib/arm64-v8a/libSDL3.so' apk.txt
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$apk" | tee sig.txt
          grep -q 'Armored-CoreR test build' sig.txt
          "$bt/aapt" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|launchable-activity)" | tee badging.txt
          mkdir -p x && unzip -q -o "$apk" 'lib/arm64-v8a/*' -d x
          readelf=$(ls "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-readelf)
          "$readelf" -Ws x/lib/arm64-v8a/libmain.so | grep -q ' SDL_main$'
          "$readelf" -d x/lib/arm64-v8a/libmain.so | grep NEEDED | tee needed.txt
          echo "::notice title=APK::$(ls -l $apk | awk '{print $5}') bytes; $(tr '\n' ' ' < badging.txt); needs: $(grep -o '\[.*\]' needed.txt | tr '\n' ' ')"

      - uses: actions/upload-artifact@v4
        with:
          name: armored-corer-android
          path: out/
