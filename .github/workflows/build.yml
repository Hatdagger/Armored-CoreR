name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: windows-2022
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL3 build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libwayland-dev libxkbcommon-dev \
            wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libdbus-1-dev \
            libudev-dev libpulse-dev libasound2-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          for f in armored-corer acr-import; do
            for p in "build/$f" "build/$f.exe" "build/Release/$f.exe"; do
              [ -f "$p" ] && cp "$p" out/
            done
          done
          cp README.md out/
          if [ "$RUNNER_OS" = "Windows" ]; then cp tools/netplay/*.bat tools/maps/*.bat out/; fi
          cp tools/maps/tinkercad_stage.py docs/MAPS.md out/

      - uses: actions/upload-artifact@v4
        with:
          name: armored-corer-${{ matrix.name }}
          path: out/

  # Original Xbox: the engine core built with nxdk into a small test program
  # (default.xbe and an .iso for xemu or a softmodded console).
  xbox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install nxdk prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld bison flex cmake git

      - name: Get nxdk
        run: git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/XboxDev/nxdk.git "$HOME/nxdk"

      - name: Build
        run: |
          export NXDK_DIR="$HOME/nxdk"
          export PATH="$NXDK_DIR/bin:$PATH"
          make -C src/platform/xbox NXDK_DIR="$NXDK_DIR" -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: armored-corer-xbox-core-test
          path: |
            src/platform/xbox/bin/default.xbe
            src/platform/xbox/*.iso
