# Master of Arena — RAM map, US disc 1 (SLUS-01030 v1.0). Source of truth for ram-map.md.
# Regenerate the doc with:  python3 tools/ram_map.py
#
# One [[var]] per named address. Fields:
#   addr    RAM address (0x80xxxxxx)
#   size    bytes (for arrays/records: the whole span)
#   type    u8 / u16 / u32 / s16 / ptr / bytes / struct / u8[n] …
#   name    short snake_case name, unique; the name code should use
#   what    one line, plain words
#   status  tested  = checked in a running game
#           code    = read from the game's code (static)
#           cheat   = from cheat codes only, not yet seen in code
#           guess   = inferred, needs a check
#   src     where the detail lives (docs/research/…)
#   owner   game (default) or lib (PsyQ library state: never touch)
#
# Region rules (from mapping/boot-loads.md, rule 1): only 0x80011000 … 0x80050DD8 (exe image + bss)
# survives module loads. Everything above 0x80050DD8 is rebuilt on every module load, so its
# addresses depend on which engine is loaded (menu FDAT 206, missions 207, link 208, VS 209, arena 210).

# ───────────── exe image: data the game keeps (save-backed) ─────────────

